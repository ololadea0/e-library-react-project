<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect 404s to the index.html with the path and query string
      // This allows client-side routers like React Router to work on GitHub Pages
      var segmentCount = 0,
        l = window.location;
      setTimeout(function () {
        if (l.pathname.split("/").length > 2 + segmentCount) {
          l.replace(
            l.pathname
              .split("/")
              .slice(0, 2 + segmentCount)
              .join("/") +
              "/?p=" +
              l.pathname
                .slice(1)
                .split("/")
                .slice(segmentCount)
                .join("/")
                .split("?")[0]
          );
        }
      }, 1);
    </script>
  </head>
  <body></body>
</html>
