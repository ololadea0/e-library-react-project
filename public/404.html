<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Redirect any 404 page request back to the main app
      const base = "/e-library-react-project"; // Your repo name
      window.location.replace(base + "/index.html");
    </script>
  </head>
  <body>
    <p>
      If you are not redirected automatically,
