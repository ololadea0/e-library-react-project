<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Preserve the path and redirect to index.html with it
      var redirect = window.location.pathname.replace(

        "/e-library-react-project/index.html#" + redirect
      );
    </script>
  </head>
